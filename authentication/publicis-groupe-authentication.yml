apis:
- api: publicis-groupe-knowhow
  name: Publicis Sapient KnowHOW
  source: >-
    OpenApiConfig.java declares both schemes and applies them as top-level security
    requirements on the generated OpenAPI document.
  security_schemes:
  - key: cookieAuth
    type: apiKey
    in: cookie
    name: authCookie
    description: Session cookie issued by the KnowHOW auth service after interactive login.
  - key: apiKeyAuth
    type: apiKey
    in: header
    name: x-api-key
    description: Static API key header for machine-to-machine calls against a KnowHOW deployment.
  applied: both schemes are added as OpenAPI securityItems, so they apply document-wide
  oauth2: false
  scopes: none — neither scheme carries a scope model
- api: publicis-groupe-sapient-slingshot
  name: Sapient Slingshot
  source: '@psnext/slingcli README: "First-time login" and "Environment variables"'
  security_schemes:
  - key: slingshotOAuth
    type: oauth2
    flow: authorization_code (browser)
    description: >-
      `/login slingshot` inside the sling TUI opens a browser window and completes an
      interactive login against Slingshot. The authorization server, token endpoint and
      scopes are not published; no /.well-known/oauth-authorization-server document is
      served on any Publicis host probed.
  - key: slingshotToken
    type: http
    scheme: bearer
    env: SLINGSHOT_TOKEN
    description: >-
      A pre-issued Slingshot access token supplied via the SLINGSHOT_TOKEN environment
      variable, which bypasses the interactive login.
