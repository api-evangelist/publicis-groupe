  name: CoreAI Block SDK
  source: '@psnext/block-sdk README: Fetcher and register()'
  security_schemes:
  - key: coreaiBlockToken
    type: platform-managed
    description: >-
      Blocks authenticate through the SDK's register() call; the Fetcher utility carries
      integrated CoreAI authentication with token validation and automatic refresh. Token
      format, issuer and lifetime are not published.
