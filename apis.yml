apis:
- aid: publicis-groupe:publicis-groupe-knowhow
  name: Publicis Sapient KnowHOW
  description: 'KnowHOW is Publicis Sapient''s open-source (Apache-2.0) engineering measurement platform
    — a KPI dashboard that pulls from Jira, source control, CI and quality tools and reports delivery
    health across transformation programmes. It is a self-hosted product, not a hosted API: the Spring
    Boot service is served under the /api context path and generates its own OpenAPI 3 document at /api/v3/api-docs
    (Swagger UI at /api/swagger-ui/index.html) on whatever host the operator deploys, so no single public
    base URL exists and API Evangelist did not capture a static spec. Authentication is a session cookie
    (authCookie) or an x-api-key header.'
  humanURL: https://knowhow.suite.publicissapient.com/wiki/spaces/PS/pages/5570561/KnowHOW
  baseURL: https://{knowhow-host}/api
