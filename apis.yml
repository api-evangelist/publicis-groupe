- aid: publicis-groupe:publicis-groupe-sapient-slingshot
  name: Sapient Slingshot
  description: Sapient Slingshot is Publicis Sapient's proprietary AI software-engineering platform —
    an enterprise LLM gateway plus a family of agents for legacy modernization, spec generation and code
    delivery. The client surface published to the public is the npm package @psnext/slingcli, which installs
    a `sling` CLI that authenticates to Slingshot over a browser OAuth flow (/login slingshot) or a pre-issued
    SLINGSHOT_TOKEN bearer token and then routes to the gateway's model catalogue. The gateway's HTTP
    contract itself is not published; the only gateway host observed in first-party source is an internal
    one that does not resolve on the public internet, so no base URL is recorded.
  humanURL: https://www.publicissapient.com/platforms/slingshot
