name: Publicis Groupe — embeddable and client-side components
note: >-
  Publicis Groupe's CoreAI platform renders third-party "Blocks" as iframes inside a
  canvas. The Block SDK is the client-side contract for those embeds — registration,
  cross-frame messaging and an authenticated fetch wrapper — and is the only embeddable
  component surface the Groupe publishes to a public registry. It is explicitly scoped:
  "This SDK is a client-side SDK intended exclusively for use with the CoreAI platform."
