name: Publicis Groupe — client libraries, CLIs and distributions
note: >-
  Publicis Groupe publishes nothing under its own name on any package registry. Every
  first-party package below is published by Publicis Sapient, a wholly-owned Publicis
  Groupe operating unit, under one of two identities: the @publicissapient npm scope /
  PublicisSapient GitHub org (open-source engineering utilities) and the @psnext npm
  scope ("Sapient AI Products" — the Slingshot, CoreAI and context-graph tooling). A
  Maven Central search for g:com.publicissapient* returned 0 artifacts, so the Java
  KnowHOW services are distributed only as source and as Docker images. PyPI, NuGet,
  RubyGems, crates.io and pkg.go.dev carry no first-party Publicis packages.
